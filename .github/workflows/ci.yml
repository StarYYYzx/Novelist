name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 门禁（ruff + 密钥 + 卫生 + pytest + 文档基线）
    # 刻意用 windows-latest 与本机开发环境一致：本项目尚未验证 Linux 可移植性，
    # 门禁的职责是"因真实缺陷变红"，不是"因平台差异变红"。可移植性验证后再加 Linux job。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 不是随手选的：它是 pyproject 声明的下限，也是能抓到 PEP 701
      # （f-string 替换字段含反斜杠 → 模块直接编译不过）那类问题的版本。
      # 本项目真的出过这个 bug（forge/nodes.py），所以下限必须被真跑一遍。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,providers]"
          pip install "ruff==0.12.0"

      # 沙箱环境变量（CODEBUDDY_SAFE_DELETE_*）由 scripts/check.py 自行注入，
      # 故意不写在这里：让"该设的环境变量"只有一个来源，避免两处漂移。
      - name: 门禁
        shell: bash
        env:
          RUFF_BIN: ruff
        run: python scripts/check.py --all
